openapi: 3.0.3
info:
  title: ReGive Backend API
  version: 1.0.0
  description: |
    Final Release API for ReGive (Sprint 1–3).
    Auth header: `Authorization: Bearer <JWT>`
servers:
  - url: http://localhost:5000/api
tags:
  - name: System
  - name: Auth
  - name: Campaigns
  - name: Donations
  - name: Volunteers
  - name: Support
  - name: Products
  - name: Inventory
  - name: Orders
  - name: Payments
  - name: Uploads
  - name: AI
  - name: Reports
  - name: Notifications
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness
      responses:
        '200':
          description: OK
  /ready:
    get:
      tags: [System]
      summary: Readiness (MongoDB)
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready
  /auth/register:
    post:
      tags: [Auth]
      summary: Register USER or BENEFICIARY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string }
                password: { type: string }
                fullName: { type: string }
                role: { type: string, enum: [USER, BENEFICIARY] }
      responses:
        '201':
          description: Registered
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: JWT + user
  /auth/me:
    get:
      tags: [Auth]
      summary: Current profile
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /auth/users:
    get:
      tags: [Auth]
      summary: List users (ADMIN only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /auth/users/{id}/role:
    patch:
      tags: [Auth]
      summary: Change user role (ADMIN only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated
  /campaigns:
    get:
      tags: [Campaigns]
      summary: List active campaigns
      responses:
        '200':
          description: OK
    post:
      tags: [Campaigns]
      summary: Create campaign (staff can set active; users create draft)
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Created
  /campaigns/manage/all:
    get:
      tags: [Campaigns]
      summary: List all campaigns incl. draft/closed (ADMIN/EMPLOYEE)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /campaigns/{id}:
    patch:
      tags: [Campaigns]
      summary: Update campaign (owner or staff)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated
    delete:
      tags: [Campaigns]
      summary: Delete campaign (owner or ADMIN)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
  /products/marketplace:
    get:
      tags: [Products]
      summary: Marketplace listings
      responses:
        '200':
          description: OK
  /products/intake:
    post:
      tags: [Products]
      summary: Intake product from donation
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Created
  /products/{id}:
    patch:
      tags: [Products]
      summary: Update product info (validated fields only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated
    delete:
      tags: [Products]
      summary: Delete product (blocked while listed or referenced by orders)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted (also removes related AI assessments)
        '400':
          description: Blocked — product is listed on marketplace
        '409':
          description: Blocked — product already in orders
  /uploads/single:
    post:
      tags: [Uploads]
      summary: Upload one image (Cloudinary or local fallback)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded (returns url, publicId or filename)
  /uploads/multiple:
    post:
      tags: [Uploads]
      summary: Upload up to 5 images
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                images:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '200':
          description: Uploaded
  /uploads/delete:
    delete:
      tags: [Uploads]
      summary: Delete image by publicId (Cloudinary) or filename (local)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Deleted
  /inventory/stock-in:
    post:
      tags: [Inventory]
      summary: Stock in
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: OK
  /orders:
    post:
      tags: [Orders]
      summary: Create order (buy now)
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Created
  /payments:
    post:
      tags: [Payments]
      summary: Create payment (returns VNPay checkoutUrl; sandbox fallback)
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Created (includes checkoutUrl)
  /payments/sandbox/confirm:
    post:
      tags: [Payments]
      summary: Confirm sandbox payment
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Paid
  /payments/vnpay/return:
    get:
      tags: [Payments]
      summary: VNPay return URL (verifies signature, redirects to client)
      responses:
        '302':
          description: Redirect to checkout page with status param
  /payments/vnpay/ipn:
    get:
      tags: [Payments]
      summary: VNPay IPN webhook (verifies signature)
      responses:
        '200':
          description: RspCode 00 if verified
  /ai/preview-donation:
    post:
      tags: [AI]
      summary: Public AI donation preview for users (rate-limited 10/min)
      responses:
        '200':
          description: Suggested assessment (never auto-applied)
  /ai/assess-product:
    post:
      tags: [AI]
      summary: Run AI suggestion (not applied)
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Suggested
  /ai/assessments/{id}/confirm:
    post:
      tags: [AI]
      summary: Human confirm/override and apply to product
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Applied (never auto-publishes)
  /reports/overview:
    get:
      tags: [Reports]
      summary: Ops/finance overview
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
  /reports/public-impact:
    get:
      tags: [Reports]
      summary: Public impact stats (home page)
      responses:
        '200':
          description: OK
  /reports/transparency-ledger:
    get:
      tags: [Reports]
      summary: Public transparency ledger (real amounts only; pending disbursements show null)
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
